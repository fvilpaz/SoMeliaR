{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — SoMeliaR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
</head>
<body class="login-body">
<div class="login-center">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="login-logo-placeholder login-logo mb-3">🍷</div>
            <div class="login-title">SoMeliaR</div>
            <div class="login-subtitle">Recuperar contraseña</div>
        </div>
        <p class="text-muted small mb-3">Introduce tu dirección de email y te enviaremos un enlace para restablecer tu contraseña.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email" class="form-label">
                    <i class="bi bi-envelope-fill me-1"></i>Email
                </label>
                <input type="email" name="email" id="id_email" class="form-control" placeholder="Tu email" required autofocus>
            </div>
            <button type="submit" class="btn btn-login btn-primary w-100 text-white">
                <i class="bi bi-send me-1"></i>Enviar enlace
            </button>
        </form>
        <hr class="divider mt-4">
        <div class="text-center">
            <a href="{% url 'login' %}" class="link-accent">Volver al inicio de sesión</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
